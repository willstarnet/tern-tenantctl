schema = 1
id = "tern-tenantctl"
name = "Tern tenantctl"
version = "0.1.0"
description = "Native views for tenantctl output: reports with ranked findings, tables with row details, readable errors."
icon = "shield"
host = "host.luau"

# Every tenantctl command: the lens shows raw output while it runs and a native view once it ends,
# and leaves help, --version and anything it cannot read raw. Zsh reports alias-expanded lines, so
# shell aliases of tenantctl are claimed too.
[[lenses]]
id = "tenantctl"
match = ["tenantctl", "tenantctl *", "bun run tenantctl *"]
